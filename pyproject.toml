[project]
name = "jevcut"
version = "0.1.0"
description = "Auto-clipping that picks cut points, not windows."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.5.7",
]

[project.optional-dependencies]
# Heavy, optional: ingest works from pre-computed word timings without these.
asr = ["faster-whisper>=1.0"]
shots = ["scenedetect>=0.6"]
dev = ["pytest>=8.0"]

[project.scripts]
jevcut = "jevcut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevcut"]

[[tool.uv.index]]
name = "typesafe"
url = "https://pypi.typesafe.ai/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
